name: Publish Timer stable release

on:
  push:
    paths:
      - .github/workflows/publish-timer-v2320.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the prepared Timer package
        env:
          BASE_URL: https://7x7live.pro/codex-release-upload-20261101
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "$BASE_URL/tiktimer.zip" -o tiktimer.zip
          printf '%s  %s\n' '3dafe93e59ed78703c5f8d28346fee9f3bbee1a00b891b87a0e715b402380ff6' 'tiktimer.zip' | sha256sum --check --status
          test "$(stat -c%s tiktimer.zip)" -eq 614574533
      - name: Publish the stable Timer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
            -f tag_name=v2.3.20 \
            -f name='TIKTIMER v2.3.20' \
            -f body='Stable Windows package for the 7x7Live launcher. Package SHA-256 is verified before publishing.' \
            -f make_latest=true
          gh release upload v2.3.20 tiktimer.zip --repo "$GITHUB_REPOSITORY"
